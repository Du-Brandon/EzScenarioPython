[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezscenario-python"
version = "0.1.0.dev0"
description = "A Python port of ezSpec's developer-facing BDD internal DSL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points.pytest11]
ezspec = "ezspec.extension.pytest.plugin"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ezspec = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests", "examples"]
markers = [
    "ezfeature: class containing ezSpec scenarios",
    "ezscenario: executable ezSpec scenario",
    "ezscenario_outline: executable ezSpec scenario outline",
]
